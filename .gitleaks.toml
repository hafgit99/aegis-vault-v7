# Gitleaks configuration for KalderaShield.
# Extends the default rules; allows the deliberate test fixtures that tripped
# the generic-api-key heuristics during the full-history scan (2026-08-29),
# and the site's translation data that tripped them since (2026-10-02).
# Run: gitleaks git -v --config .gitleaks.toml

[extend]
useDefault = true

[allowlist]
description = "Deliberate test fixtures and documentation identifiers"
paths = [
  '''(^|/)src/lib/otp\.test\.ts$''',
  '''(^|/)src/lib/emergencyKit\.test\.ts$''',
  '''(^|/)src/lib/syncConfigStorage\.test\.ts$''',
  '''(^|/)src/components/lock/LockScreenComponents\.test\.tsx$''',
  '''(^|/)src/components/SettingsPanel\.test\.tsx$''',
  '''(^|/)docs/ARCHITECTURE_REVIEW\.md$''',
  # The site's translation data, not credentials.
  #
  # generic-api-key reads `"<something>key|token|secret|password": "<value>"` as a
  # credential pair. A locale dictionary is a flat map of the same shape, and the
  # per-language page packs are the same again -- so `"p-attachments-rel1":
  # "Password vault"` reads as an assignment to a key called "password". Three
  # files tripped it on the i18n commit:
  #
  #   kalderashield-website/assets/js/i18n/en.json
  #   kalderashield-website/assets/js/i18n/it.json
  #   kalderashield-website/i18n-pages/it.json
  #
  # Every value in these files is prose written by a translator. They are
  # generated by kalderashield-website/scripts/generate-locales.cjs, contain no
  # key material, and are checked by the copy, coverage and i18n parity gates.
  # Listing the directory rather than one rule keeps the whole class of false
  # positive out instead of chasing the next `"...password": "..."` pair.
  '''(^|/)kalderashield-website/(assets/js/i18n|i18n-pages|content)/''',
]
