<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://www.cloudflare.com/cdn-cgi/trace; frame-ancestors 'none'; form-action 'none';">
  <meta name="referrer" content="no-referrer">
  <title>AegisVault 7 — Gizlilik Politikası</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background grid pattern -->
  <div class="bg-grid-overlay"></div>

  <!-- Ambient glow orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Navigation -->
  <nav id="main-nav">
    <a href="index.html" class="logo" id="nav-logo">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <span class="logo-text">AegisVault</span>
    </a>
    
    <div class="nav-actions">
      <!-- Back to Main Button -->
      <a href="index.html" class="btn btn-ghost" style="padding:0.5rem 1rem;font-size:0.85rem;" data-i18n="back-to-home">← Ana Sayfa</a>

      <!-- Language Dropdown Selector -->
      <div class="lang-dropdown-container">
        <button class="lang-btn" id="lang-btn" aria-label="Language Selector" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span id="active-lang-text">EN</span>
          <svg class="chevron-icon" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="lang-dropdown-menu" id="lang-dropdown-menu">
          <button class="lang-menu-item" data-lang="tr">Türkçe (TR)</button>
          <button class="lang-menu-item" data-lang="en">English (EN)</button>
          <button class="lang-menu-item" data-lang="zh">简体中文 (ZH)</button>
        </div>
      </div>

      <!-- Light/Dark Mode Switcher -->
      <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle Theme">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </nav>

  <div class="page-wrapper" style="padding-top: 8rem; padding-bottom: 6rem; max-width: 800px; margin: 0 auto; width: 90%;">
    <div class="card legal-page-card" style="padding: 3rem 2.5rem; display:flex; flex-direction:column; gap:2rem;">
      <h1 id="legal-page-title" class="gradient-text" style="font-size:2.25rem; font-weight:800; letter-spacing:-1px;">...</h1>
      <div id="legal-page-body" class="legal-page-body" style="font-size:0.95rem; line-height:1.7; display:flex; flex-direction:column; gap:1.5rem;">
        <!-- Injected Content -->
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer style="margin-top: 4rem;">
    <div class="footer-bottom">
      <p id="footer-copyright-text" data-i18n="footer-copy">&copy; 2026 AegisVault. Tüm Hakları Saklıdır.</p>
      <p>Zero-Knowledge · Offline-First · Proprietary</p>
    </div>
  </footer>

  <script src="legal.js"></script>
</body>
</html>
