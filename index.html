<!doctype html>
<html lang="tr" class="dark splash-root">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="KalderaShield is a local-first secure vault for passwords, cards, identities, secure notes, and encrypted backups."
    />
    <meta name="application-name" content="KalderaShield" />
    <meta name="theme-color" content="#121412" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; img-src 'self' data: blob: asset: https://asset.localhost; style-src 'self'; font-src 'self' data:; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; media-src 'self' blob:; connect-src 'self' ipc: http://ipc.localhost https://api.pwnedpasswords.com data: blob:;"
    />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/splash.css" />
    <title>KalderaShield | Local-First Secure Vault</title>
  </head>
  <body>
    <div id="root">
      <div class="splash-screen" id="kalderashield-splash">
        <!--
          The caldera mark, rasterised from
          src-tauri/icon-source/kalderashield-icon.svg by
          scripts/render-app-logo.cjs. This used to be an inline Lucide
          ShieldCheck glyph coloured emerald, which matched no other icon the
          app ships. An <img> rather than inline markup so the splash shows the
          same artwork as the launcher tile, the lock screen and the sidebar.
        -->
        <div class="splash-icon-box">
          <img src="/splash-icon.png" width="96" height="96" alt="" decoding="sync" />
        </div>
        <p class="splash-title">KALDERASHIELD</p>
        <div class="splash-spinner"></div>
        <div class="splash-progress"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
