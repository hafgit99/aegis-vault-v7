[sources]
# Only crates.io. A dependency that starts arriving from a git host or an
# unknown registry must be reviewed before it can ship.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
