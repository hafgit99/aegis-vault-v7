<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ks-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14"/>
      <stop offset="50%" stop-color="#080a0f"/>
      <stop offset="100%" stop-color="#050609"/>
    </linearGradient>

    <!-- Outer Squircle Rim -->
    <linearGradient id="ks-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b39" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#2a3245" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff4500" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Shield Plate Gradient (Titanium Obsidian) -->
    <linearGradient id="ks-plate-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2533"/>
      <stop offset="45%" stop-color="#141821"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="ks-plate-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3245"/>
      <stop offset="45%" stop-color="#191f2c"/>
      <stop offset="100%" stop-color="#0e1219"/>
    </linearGradient>

    <!-- Shield Bevel Outer Stroke -->
    <linearGradient id="ks-shield-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4e5d78"/>
      <stop offset="40%" stop-color="#202736"/>
      <stop offset="80%" stop-color="#ff5722"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>

    <!-- Caldera Magma Core Glow -->
    <radialGradient id="ks-magma-glow" cx="50%" cy="56%" r="48%">
      <stop offset="0%" stop-color="#fff5cc" stop-opacity="0.95"/>
      <stop offset="18%" stop-color="#ffab00" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#ff3d00" stop-opacity="0.7"/>
      <stop offset="75%" stop-color="#d50000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a0400" stop-opacity="0"/>
    </radialGradient>

    <!-- Caldera Geo Crater Gradient -->
    <linearGradient id="ks-caldera-crest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6d00"/>
      <stop offset="50%" stop-color="#ff3d00"/>
      <stop offset="100%" stop-color="#dd2c00"/>
    </linearGradient>

    <!-- Cyber Shield Core Aura -->
    <radialGradient id="ks-cyber-aura" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Lock Shackle Chrome -->
    <linearGradient id="ks-shackle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0e6ed"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8a99ad"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="ks-glow-fire" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="ks-soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <filter id="ks-inner-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ff3d00" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Background Squircle (Apple/Windows App Tile) -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#ks-bg)"/>
  
  <!-- Subtle Internal Background Ambient Glow -->
  <circle cx="512" cy="520" r="380" fill="url(#ks-magma-glow)" opacity="0.35"/>
  <circle cx="512" cy="380" r="320" fill="url(#ks-cyber-aura)"/>

  <!-- Squircle Border Rim -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="none" stroke="url(#ks-rim)" stroke-width="6"/>

  <!-- 2. Main Outer Shield Container with Shadow -->
  <g filter="url(#ks-soft-shadow)">
    <!-- Outer Shield Frame / Bevel -->
    <path d="M512 118 
             L790 220 
             C790 460 706 676 512 856 
             C318 676 234 460 234 220 
             Z" 
          fill="#0c1017" 
          stroke="url(#ks-shield-edge)" 
          stroke-width="14" 
          stroke-linejoin="round"/>

    <!-- Left Shield Facet (Deep Obsidian / Matte) -->
    <path d="M512 134 
             L252 230 
             C252 454 330 656 512 830 
             Z" 
          fill="url(#ks-plate-left)"/>

    <!-- Right Shield Facet (Specular Highlight) -->
    <path d="M512 134 
             L772 230 
             C772 454 694 656 512 830 
             Z" 
          fill="url(#ks-plate-right)"/>

    <!-- Center Spine Highlight -->
    <line x1="512" y1="134" x2="512" y2="830" stroke="#4facfe" stroke-width="4" stroke-opacity="0.4"/>
  </g>

  <!-- 3. Inner Cyber Deflector Lines (Hexagonal / Geometric) -->
  <g stroke="#00f2fe" stroke-opacity="0.4" stroke-width="4" fill="none" stroke-linejoin="round">
    <path d="M512 210 L710 286 C710 472 636 636 512 770 C388 636 314 472 314 286 Z"/>
    <path d="M512 250 L400 330 M512 250 L624 330"/>
    <path d="M314 360 L420 400 M710 360 L604 400"/>
  </g>

  <!-- 4. The Caldera Magma Core (Volcanic Energy Crucible) -->
  <g filter="url(#ks-glow-fire)">
    <!-- Magma Glow Pool behind crater -->
    <ellipse cx="512" cy="560" rx="190" ry="170" fill="url(#ks-magma-glow)"/>

    <!-- Stylized Caldera Crater / Angular 'K-S' Energy Chevron -->
    <!-- Lower Molten Crest -->
    <path d="M512 730
             C560 670 630 580 630 490
             C630 420 580 370 512 370
             C444 370 394 420 394 490
             C394 580 464 670 512 730 Z"
          fill="#130704"
          stroke="url(#ks-caldera-crest)"
          stroke-width="12"
          stroke-linejoin="round"/>

    <!-- Radiant Caldera Energy Fissure (Stylized Volcanic V & Vault Key) -->
    <path d="M512 410
             L565 470
             L530 540
             L570 610
             L512 680
             L454 610
             L494 540
             L459 470 Z"
          fill="url(#ks-caldera-crest)"
          stroke="#fff0b3"
          stroke-width="4"/>

    <!-- Bright White-Hot Molten Core Nucleus -->
    <circle cx="512" cy="540" r="32" fill="#ffffff" filter="url(#ks-inner-shadow)"/>
    <circle cx="512" cy="540" r="16" fill="#fff9db"/>
  </g>

  <!-- 5. Cybernetic Vault Shackle (Defense lock arch above caldera) -->
  <g filter="url(#ks-soft-shadow)">
    <!-- Shackle Loop -->
    <path d="M442 410 V346 C442 308 473 276 512 276 C551 276 582 308 582 346 V410" 
          fill="none" 
          stroke="url(#ks-shackle)" 
          stroke-width="26" 
          stroke-linecap="round"/>
    <!-- Shackle Inner Specular Glow -->
    <path d="M450 400 V346 C450 312 478 284 512 284 C546 284 574 312 574 346 V400" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="6" 
          stroke-linecap="round"
          stroke-opacity="0.8"/>
  </g>

  <!-- 6. Foreground Volcanic & Cyber Particles (Dynamic Depth) -->
  <circle cx="430" cy="460" r="6" fill="#ffe082" opacity="0.9"/>
  <circle cx="594" cy="480" r="5" fill="#ffab00" opacity="0.8"/>
  <circle cx="512" cy="330" r="4" fill="#00f2fe" opacity="0.9"/>
  <circle cx="360" cy="540" r="4" fill="#ff5722" opacity="0.7"/>
  <circle cx="664" cy="530" r="4" fill="#ff6d00" opacity="0.7"/>
  <circle cx="470" cy="650" r="5" fill="#ffd54f" opacity="0.9"/>
  <circle cx="554" cy="640" r="6" fill="#ff9100" opacity="0.9"/>

  <!-- Top Glass Highlight Arc -->
  <path d="M260 236 C340 180 430 148 512 144 C594 148 684 180 764 236 C670 200 580 180 512 180 C444 180 354 200 260 236 Z" 
        fill="#ffffff" 
        opacity="0.18"/>
</svg>
