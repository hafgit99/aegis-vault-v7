# CI — typecheck and unit test gates on every push and pull request
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

  rust-tests:
    name: Rust check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies (Tauri/WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Cargo check
        run: cargo check --all-targets

      - name: Cargo tests
        run: cargo test

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-deny (official release binary)
        run: |
          CD_VERSION=0.20.2
          curl -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CD_VERSION}/cargo-deny-${CD_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/cargo-deny.tar.gz
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp
          sudo install -m 755 "/tmp/cargo-deny-${CD_VERSION}-x86_64-unknown-linux-musl/cargo-deny" /usr/local/bin/cargo-deny
          cargo-deny --version

      - name: Cargo deny (RustSec advisories, bans, licences, sources)
        # All four gates are release blockers. `cargo deny check advisories`
        # alone left the licence and source policies in src-tauri/deny.toml
        # unenforced, so a copyleft or unknown-origin dependency could ship
        # without any signal.
        run: cargo deny check advisories bans licenses sources

  security:
    name: Security gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 'Security: dependencies audit'
        run: npm run security:dependencies

      - name: 'Security: CSP strict-style gate'
        run: npm run security:csp

      - name: 'Security: no JS master password string'
        run: npm run security:no-js-master-string

      # K-1 regression gate. The credential-handling Activity must stay
      # android:exported="false" and must keep resolving Autofill requests
      # through the in-process registry instead of Intent extras, which is what
      # closed the forged-intent credential exfiltration.
      #
      # The gate also requires Android lint to be wired in, because lint was
      # never run and had seven errors waiting unnoticed — four of them NewApi on
      # this autofill path, a class extending an API 26 type while minSdk is 24.
      - name: 'Security: Android Autofill trust boundary (K-1)'
        run: npm run security:android-autofill-boundary

      # ── Android lint, made actually runnable on Linux ─────────────────────
      #
      # This step had been wired but could never have worked, and the wiring
      # check that approved it only verified *that it was mentioned*. Two
      # independent reasons it failed on this runner:
      #
      #   1. It invoked the Windows batch wrapper on `ubuntu-latest`. The POSIX
      #      wrapper sits next to it and is the one that can run here.
      #   2. There is no local.properties: it is gitignored, and the one on a
      #      developer machine holds a Windows SDK path anyway. Without
      #      sdk.dir (or ANDROID_HOME) Gradle cannot resolve the SDK at all.
      #
      # So the K-1 lint gate had been reporting "wired" for days while never
      # executing. Fixed below, and the K-1 gate now checks the functional
      # requirements, not just the mention, so the same false "wired" cannot
      # come back.
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Android SDK location
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          test -d "${ANDROID_HOME}"
          # `local.properties` is gitignored, so it has to be written here. The
          # value must escape the drive-letter colon on Windows, but here it is
          # a plain POSIX path.
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > src-tauri/gen/android/local.properties
          cat src-tauri/gen/android/local.properties

      - name: 'Android: lint (K-1)'
        working-directory: src-tauri/gen/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:lintArmDebug --console=plain --no-daemon

      - name: 'Security: session callback authorization gate'
        run: npm run security:session-gates

      # Y-19: the release workflow must keep its blocking signing gates and
      # must keep the signing steps secret-driven and correctly ordered. This
      # catches a deleted, reordered or mis-wired signing step in ordinary CI,
      # rather than on release day.
      - name: 'Security: release signing gate (Y-19)'
        run: npm run security:release-signing

      # Y-16 / O-6: the Rust IPC boundary and the TypeScript Argon2id layer are
      # two implementations of one policy. If they drift, a parameter the desktop
      # side refuses could still be honoured by the WASM path, and nothing else
      # would notice.
      - name: 'Security: Argon2id bound parity (Y-16 / O-6)'
        run: npm run security:argon2-bounds

      # N-2 / #26: the i18n audit was never wired into CI, which is why a
      # two-language key regression (double-quoted keys are invisible to the
      # audit's single-quote key regex) stayed invisible until it was found
      # locally. Parity is a release-quality gate, not a nicety: a missing key
      # ships as a raw key string in the UI of a password manager.
      - name: 'i18n key parity audit (12 locales)'
        run: npm run i18n:audit

      - name: Fuzz tests
        run: npm run test:fuzz

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
