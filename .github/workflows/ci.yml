# CI — typecheck and unit test gates on every push and pull request
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

  rust-tests:
    name: Rust check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies (Tauri/WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Cargo check
        run: cargo check --all-targets

      - name: Cargo tests
        run: cargo test

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-deny (official release binary)
        run: |
          CD_VERSION=0.20.2
          curl -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CD_VERSION}/cargo-deny-${CD_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/cargo-deny.tar.gz
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp
          sudo install -m 755 "/tmp/cargo-deny-${CD_VERSION}-x86_64-unknown-linux-musl/cargo-deny" /usr/local/bin/cargo-deny
          cargo-deny --version

      - name: Cargo deny (RustSec advisories, bans, licences, sources)
        # All four gates are release blockers. `cargo deny check advisories`
        # alone left the licence and source policies in src-tauri/deny.toml
        # unenforced, so a copyleft or unknown-origin dependency could ship
        # without any signal.
        run: cargo deny check advisories bans licenses sources

  security:
    name: Security gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 'Security: dependencies audit'
        run: npm run security:dependencies

      - name: 'Security: CSP strict-style gate'
        run: npm run security:csp

      - name: 'Security: no JS master password string'
        run: npm run security:no-js-master-string

      # K-1 regression gate. The credential-handling Activity must stay
      # android:exported="false" and must keep resolving Autofill requests
      # through the in-process registry instead of Intent extras, which is what
      # closed the forged-intent credential exfiltration.
      #
      # The gate also requires Android lint to be wired in, because lint was
      # never run and had seven errors waiting unnoticed — four of them NewApi on
      # this autofill path, a class extending an API 26 type while minSdk is 24.
      # That linter is not a step here: it needs the JDK, the Android SDK, the NDK
      # and a populated cargo registry, none of which this job has, and a cold
      # Gradle run outlasts this job's whole budget — so a lint timeout would take
      # every other security gate below down with it. It runs in the separate
      # `android-lint` job; this job stays the static-gate job.
      - name: 'Security: Android Autofill trust boundary (K-1)'
        run: npm run security:android-autofill-boundary

      - name: 'Security: session callback authorization gate'
        run: npm run security:session-gates

      # Y-19: the release workflow must keep its blocking signing gates and
      # must keep the signing steps secret-driven and correctly ordered. This
      # catches a deleted, reordered or mis-wired signing step in ordinary CI,
      # rather than on release day.
      - name: 'Security: release signing gate (Y-19)'
        run: npm run security:release-signing

      # Y-16 / O-6: the Rust IPC boundary and the TypeScript Argon2id layer are
      # two implementations of one policy. If they drift, a parameter the desktop
      # side refuses could still be honoured by the WASM path, and nothing else
      # would notice.
      - name: 'Security: Argon2id bound parity (Y-16 / O-6)'
        run: npm run security:argon2-bounds

      # N-2 / #26: the i18n audit was never wired into CI, which is why a
      # two-language key regression (double-quoted keys are invisible to the
      # audit's single-quote key regex) stayed invisible until it was found
      # locally. Parity is a release-quality gate, not a nicety: a missing key
      # ships as a raw key string in the UI of a password manager.
      - name: 'i18n key parity audit (12 locales)'
        run: npm run i18n:audit

      - name: Fuzz tests
        run: npm run test:fuzz

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Android lint (K-1) ─────────────────────────────────────────────────────
  #
  # The K-1 static gate above can only check what it can read as text. It cannot
  # know that `AegisAutofillService` extends `AutofillService`, an API 26 type,
  # while the app's minSdk is 24 — only the real linter knows that, and seven
  # such errors sat unnoticed for as long as the Android build existed.
  #
  # This job exists because that linter needs a build environment the security
  # job does not have. Three things it needs, each of which was a silent reason
  # this step could never have worked when it lived inside `security`:
  #
  #   1. `./gradlew`, the POSIX wrapper. `gradlew.bat` — what `npm run
  #      android:lint` calls — cannot run on a Linux runner at all.
  #   2. A resolvable SDK. `local.properties` is gitignored, so `sdk.dir` has to
  #      be written here.
  #   3. The Tauri Gradle glue. `settings.gradle` does `apply from:
  #      'tauri.settings.gradle'` and `app/build.gradle.kts` applies
  #      `tauri.build.gradle.kts`. Both are gitignored — they contain absolute
  #      cargo-registry paths, so committing them would both leak a username and
  #      break every other machine — and neither is tracked. On a clean checkout
  #      Gradle therefore aborts during *configuration*, with "Could not read
  #      script", before a single file is linted. The release workflow never
  #      tripped over this because `tauri android build` writes the glue itself
  #      on its way to the build; a bare `./gradlew` does not.
  #
  # The glue is written by `scripts/android-gradle-glue.cjs`, NOT by
  # `tauri android init`. init was tried first, on the reasoning that it is the
  # command that "initialises the Android target". It is not: with both files
  # deleted it prints "Project generated successfully!" and creates neither. It
  # only scaffolds a project that does not exist yet, and the glue is a
  # build-time side effect of build/dev/run — every one of which compiles the
  # Rust library for three Android ABIs with the NDK, which is not what this job
  # is for. The script header records how it reproduces the CLI's output and
  # where that reproduction could drift.
  #
  # The `cargo fetch` is not optional: the glue points at
  # `$CARGO_HOME/registry/src/*/tauri-*/mobile/android`, so the registry has to
  # contain the tauri crates before the script runs. On a fresh runner it is
  # empty.
  android-lint:
    name: Android lint (K-1)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Fetch Rust dependencies
        # The Gradle glue generated below resolves the tauri Gradle
        # subprojects from the cargo registry, so the crates have to be unpacked
        # before it runs.
        working-directory: src-tauri
        run: cargo fetch --locked

      - name: Resolve Android SDK and NDK
        run: |
          set -euo pipefail
          # `${ANDROID_HOME:-}` rather than `${ANDROID_HOME}`: with `set -u` a
          # runner image that stops shipping the SDK would abort on an unbound
          # variable, which reads like a workflow bug rather than a missing
          # toolchain. An explicit message names the actual cause.
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME}" ]; then
            echo "::error::Android SDK not found on the runner (ANDROID_HOME='${ANDROID_HOME:-}'). This job needs the SDK that ships with the GitHub runner image."
            exit 1
          fi
          # `local.properties` is gitignored, so `sdk.dir` has to be written
          # here. On Windows the drive-letter colon needs escaping; here it is a
          # plain POSIX path.
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > src-tauri/gen/android/local.properties
          echo "sdk.dir=${ANDROID_HOME}"

          NDK_DIR=$(ls -d "${ANDROID_HOME}/ndk/"* 2>/dev/null | head -n 1 || true)
          if [ -z "$NDK_DIR" ]; then
            echo "::error::Android NDK not found on the runner (ANDROID_HOME=${ANDROID_HOME}); 'tauri android init' needs one to lay out the project"
            exit 1
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK resolved: $NDK_DIR"

      - name: Generate Tauri Gradle glue
        run: npm run android:gradle-glue

      - name: 'Android: lint (K-1)'
        working-directory: src-tauri/gen/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:lintArmDebug --console=plain --no-daemon
