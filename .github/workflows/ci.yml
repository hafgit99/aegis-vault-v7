name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: TypeCheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: TypeScript TypeCheck
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

      - name: Build Web Extensions
        run: npm run build:extension

      - name: Security Gate - No JS Master String
        run: npm run security:no-js-master-string

      - name: Security Gate - CSP Hardening Check
        run: npm run security:csp

      - name: Build Web Application
        run: npm run build

      - name: Security Gate - Asset Integrity Manifest
        run: npm run security:asset-integrity

      - name: Run Unit Tests
        run: npm run test:unit

  rust-gate:
    name: Rust Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Cargo Tests
        run: |
          cd src-tauri
          cargo test --verbose
