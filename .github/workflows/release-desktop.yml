# Desktop Release — tag-gated, signed, reproducible release pipeline
#
# Flow: push tag `v*` (package.json version MUST match the tag)
#   1. Build Linux / macOS / Windows packages in parallel (tests always run)
#   2. Collect artifacts + Tauri updater bundles (incl. minisign .sig files)
#   3. Generate latest.json updater manifest
#   4. Sign every artifact with cosign (Sigstore keyless, OIDC-bound)
#   5. Publish a GitHub Release with all artifacts, signatures and checksums
#
# Security notes:
#   - All actions are SHA-pinned.
#   - Build jobs: contents: read only. Publish job: contents: write + id-token: write.
#   - The tag must point to a commit on a protected branch; version is verified against the tag.
name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1 (SHA-pinned)
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (SHA-pinned)

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (SHA-pinned)
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build browser extensions
        run: npm run build:extension

      - name: Build Linux desktop packages
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Release security hardening gate
        run: npm run security:release-hardening

      - name: Collect Linux release artifacts
        run: npm run release:collect -- --platform linux

      - name: Collect Linux updater bundles and signatures
        run: |
          find src-tauri/target/release/bundle -type f \( \
            -name '*.sig' -o -name '*.tar.gz' -o -name '*.nsis.zip' \) \
            -exec cp {} release-local/linux/ \;
          ls -la release-local/linux/

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (SHA-pinned)
        with:
          name: aegis-vault-v7-linux
          if-no-files-found: error
          retention-days: 14
          path: release-local/linux/**

  build-macos:
    name: Build macOS packages
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1 (SHA-pinned)
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (SHA-pinned)
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (SHA-pinned)
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build browser extensions
        run: npm run build:extension

      - name: Build macOS universal desktop packages
        run: npx tauri build --target universal-apple-darwin
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Release security hardening gate
        run: npm run security:release-hardening

      - name: Collect macOS release artifacts
        run: npm run release:collect -- --platform macos

      - name: Collect macOS updater bundles and signatures
        run: |
          find src-tauri/target -path '*release/bundle*' -type f \( \
            -name '*.sig' -o -name '*.tar.gz' -o -name '*.nsis.zip' \) \
            -exec cp {} release-local/macos/ \;
          ls -la release-local/macos/

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (SHA-pinned)
        with:
          name: aegis-vault-v7-macos
          if-no-files-found: error
          retention-days: 14
          path: release-local/macos/**

  build-windows:
    name: Build Windows packages
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1 (SHA-pinned)
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (SHA-pinned)

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (SHA-pinned)
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build browser extensions
        run: npm run build:extension

      - name: Build Windows desktop packages
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Release security hardening gate
        run: npm run security:release-hardening

      - name: Collect Windows release artifacts
        run: npm run release:collect -- --platform windows

      - name: Collect Windows updater bundles and signatures
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-local/windows | Out-Null
          Get-ChildItem src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Name -match '\.sig$|\.tar\.gz$|\.nsis\.zip$' } |
            Copy-Item -Destination release-local/windows
          Get-ChildItem release-local/windows | Select-Object -ExpandProperty Name

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (SHA-pinned)
        with:
          name: aegis-vault-v7-windows
          if-no-files-found: error
          retention-days: 14
          path: release-local/windows/**

  publish:
    name: Sign and publish GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Releasing version ${PKG_VERSION} (tag ${GITHUB_REF_NAME})"

      - name: Download Linux artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (SHA-pinned)
        with:
          name: aegis-vault-v7-linux
          path: release-local/linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (SHA-pinned)
        with:
          name: aegis-vault-v7-macos
          path: release-local/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0 (SHA-pinned)
        with:
          name: aegis-vault-v7-windows
          path: release-local/windows

      - name: Generate Tauri updater manifest (latest.json)
        run: node scripts/generate-updater-manifest.cjs

      - name: Generate global SHA256SUMS.txt
        run: |
          cd release-local
          find linux macos windows updater -type f ! -name 'metadata.json' ! -name 'README.md' \
            -exec sha256sum {} \; \
            | awk '{ n=split($2, p, "/"); printf "%s  %s\n", $1, p[n] }' \
            | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1 (SHA-pinned)

      - name: Sign all artifacts (Sigstore keyless)
        run: |
          set -e
          signed=0
          while IFS= read -r -d '' f; do
            # Preserve existing Tauri (minisign) signatures — they are consumed by the updater.
            if [ -f "${f}.sig" ]; then
              echo "skip (already signed by Tauri): ${f}"
              continue
            fi
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
            signed=$((signed + 1))
          done < <(find release-local/linux release-local/macos release-local/windows release-local/updater -type f ! -name '*.sig' ! -name '*.pem' -print0)
          echo "Signed ${signed} artifact(s) with Sigstore keyless."
          [ "$signed" -gt 0 ] || { echo "::error::No artifacts were signed"; exit 1; }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2 (SHA-pinned)
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            release-local/linux/**
            release-local/macos/**
            release-local/windows/**
            release-local/updater/latest.json
            release-local/SHA256SUMS.txt
