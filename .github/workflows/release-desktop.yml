# Desktop + Android + Extensions Release — tag-gated, signed, reproducible release pipeline
#
# Flow: push tag `v*` (package.json version MUST match the tag)
#   1. Build Linux / macOS / Windows packages, signed Android APKs and browser
#      extension packages (Chrome / Edge / Firefox / Safari) in parallel (tests always run)
#   2. Collect artifacts + Tauri updater bundles (incl. minisign .sig files)
#   3. Generate latest.json updater manifest
#   4. Sign every artifact with cosign (Sigstore keyless, OIDC-bound)
#   5. Publish a GitHub Release with all artifacts, signatures and checksums
#
# Security notes:
#   - All actions are SHA-pinned.
#   - Build jobs: contents: read only. Publish job: contents: write + id-token: write.
#   - The tag must point to a commit on a protected branch; version is verified against the tag.
name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # plan: decide which desktop platforms this run is allowed to publish.
  #
  # Why this exists: macOS and Windows cannot be published unsigned (Y-19), and
  # without certificates the whole pipeline simply goes red and nothing ships.
  # That is the correct default, but it also means there is no way to ship a
  # Linux-only release in the meantime -- and Linux is the one platform whose
  # artifacts need no certificate to be legitimate.
  #
  # The selection is a repository *variable* (`vars`), not a secret, so it is
  # visible in the repo settings and auditable in the run summary. Unset or
  # "all" means every platform, which preserves the pre-existing fail-closed
  # behaviour exactly. Setting it to e.g. "linux" is the only way to narrow it.
  #
  # Deliberately NOT a workflow input: this workflow is tag-triggered, and tags
  # cannot carry inputs. It is also deliberately not `continue-on-error` on the
  # signing gates: that would turn a loud failure into a silent skip, and the
  # Y-19 gate exists precisely to fail loudly.
  plan:
    name: Plan release platforms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.select.outputs.macos }}
      windows: ${{ steps.select.outputs.windows }}
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - name: Select platforms
        id: select
        env:
          REQUESTED_PLATFORMS: ${{ vars.RELEASE_DESKTOP_PLATFORMS }}
        run: node scripts/select-release-platforms.cjs

  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1 (SHA-pinned)
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (SHA-pinned)

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (SHA-pinned)
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build browser extensions
        run: npm run build:extension

      - name: Build Linux desktop packages
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Release security hardening gate
        run: npm run security:release-hardening

      - name: Collect Linux release artifacts
        run: npm run release:collect -- --platform linux --skip-extensions

      - name: Collect Linux updater bundles and signatures
        run: |
          find src-tauri/target/release/bundle -type f \( \
            -name '*.sig' -o -name '*.tar.gz' -o -name '*.nsis.zip' \) \
            -exec cp {} release-local/linux/ \;
          ls -la release-local/linux/

      - name: 'Signing report gate — block unsigned releases (Y-19)'
        run: npm run desktop:release:signing:report -- --platform linux --dir release-local/linux --require-signed

      - name: Desktop release gate
        run: npm run desktop:release:gate -- --platform linux
      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (SHA-pinned)
        with:
          name: aegis-vault-v7-linux
          if-no-files-found: error
          retention-days: 14
          path: release-local/linux/**

  build-macos:
    name: Build macOS packages
    needs: [plan]
    if: needs.plan.outputs.macos == 'true'
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1 (SHA-pinned)
        with:
          node-version: 22
          cache: npm

      # ── Y-19: real Developer ID signing ─────────────────────────────────────
      # This job previously always built with `APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY_RESOLVED || '-' }}`,
      # i.e. ad-hoc. An ad-hoc signature cannot pass `spctl --assess`, so the
      # signing-report gate below correctly failed — the job produced a build
      # that was never publishable. Signing now happens when the documented
      # secrets exist, and the build still fails at the gate when they do not.
      # That is deliberate: an unsigned public release must not be possible.
      - name: 'Import Developer ID certificate (Y-19)'
        if: ${{ env.APPLE_SIGNING_CERT_P12 != '' }}
        env:
          APPLE_SIGNING_CERT_P12: ${{ secrets.APPLE_SIGNING_CERT_P12 }}
          APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"

          # Never let a failure leave the certificate or keychain behind.
          cleanup() {
            security delete-keychain "$KEYCHAIN" 2>/dev/null || true
            rm -f "$CERT_PATH"
          }
          trap cleanup EXIT

          echo "$APPLE_SIGNING_CERT_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" \
            -P "$APPLE_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Record the identity so the build step can use it instead of "-".
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in the imported certificate."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY_RESOLVED=$IDENTITY" >> "$GITHUB_ENV"
          echo "Resolved Developer ID identity."

      - name: 'Store notarization credentials (Y-19)'
        if: ${{ env.APPLE_SIGNING_CERT_P12 != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
            echo "::error::APPLE_ID, APPLE_TEAM_ID and APPLE_APP_SPECIFIC_PASSWORD are all required for notarization."
            exit 1
          fi
          xcrun notarytool store-credentials "AC_NOTARY" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (SHA-pinned)
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (SHA-pinned)
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build browser extensions
        run: npm run build:extension

      - name: Build macOS universal desktop packages
        run: npx tauri build --target universal-apple-darwin
        env:
          # Y-19: the real Developer ID identity when a certificate was imported,
          # otherwise ad-hoc. Either way the signing-report gate below decides
          # whether the result may be published.
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY_RESOLVED || '-' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 'Notarize and staple macOS build (Y-19)'
        if: ${{ env.APPLE_SIGNING_CERT_P12 != '' }}
        run: |
          set -euo pipefail
          APP_PATH=$(find src-tauri/target -type d -name '*.app' -path '*release/bundle/macos*' | head -n1)
          DMG_PATH=$(find src-tauri/target -type f -name '*.dmg' -path '*release/bundle/macos*' | head -n1)
          if [ -z "$APP_PATH" ] || [ -z "$DMG_PATH" ]; then
            echo "::error::Could not locate the macOS .app/.dmg to notarize."
            exit 1
          fi

          # Sign the bundle explicitly as well, so the signature covers the
          # notarized contents rather than depending on the bundler's timing.
          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          xcrun notarytool submit "$DMG_PATH" --keychain-profile "AC_NOTARY" --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

          # A successful staple is necessary but not sufficient: the gate below
          # independently re-verifies with spctl.
          echo "Notarized and stapled: $DMG_PATH"

      - name: Release security hardening gate
        run: npm run security:release-hardening

      - name: Collect macOS release artifacts
        run: npm run release:collect -- --platform macos --skip-extensions

      - name: Collect macOS updater bundles and signatures
        run: |
          find src-tauri/target -path '*release/bundle*' -type f \( \
            -name '*.sig' -o -name '*.tar.gz' -o -name '*.nsis.zip' \) \
            -exec cp {} release-local/macos/ \;
          # GitHub normalizes spaces in release asset names to dots. Rename locally so that
          # artifact filename == release asset name == latest.json updater URL (exact match).
          for f in release-local/macos/*; do
            case "$f" in
              *' '*) mv "$f" "release-local/macos/$(basename "$f" | tr ' ' '.')" ;;
            esac
          done
          ls -la release-local/macos/

      - name: 'Signing report gate — block unsigned releases (Y-19)'
        run: npm run desktop:release:signing:report -- --platform macos --dir release-local/macos --require-signed

      - name: Desktop release gate
        run: npm run desktop:release:gate -- --platform macos
      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (SHA-pinned)
        with:
          name: aegis-vault-v7-macos
          if-no-files-found: error
          retention-days: 14
          path: release-local/macos/**

  build-windows:
    name: Build Windows packages
    needs: [plan]
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1 (SHA-pinned)
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (SHA-pinned)

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (SHA-pinned)
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build browser extensions
        run: npm run build:extension

      # ── Y-19: Authenticode signing ─────────────────────────────────────────
      # There was previously no signing step at all on Windows, so every
      # published `.exe`/`.msi` reached users unsigned and the signing-report
      # gate failed. Secret names match `docs/RELEASE_PLAN.md`.
      - name: 'Import Authenticode certificate (Y-19)'
        if: ${{ env.WINDOWS_SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'aegis-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))

          $secure = ConvertTo-SecureString -String $env:WINDOWS_SIGNING_CERT_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $secure | Out-Null
          Remove-Item -Force $pfxPath

          $cert = Get-ChildItem 'Cert:\CurrentUser\My' |
            Where-Object { $_.HasPrivateKey -and $_.EnhancedKeyUsageList.ObjectId -contains '1.3.6.1.5.5.7.3.3' } |
            Select-Object -First 1
          if (-not $cert) { throw 'No code-signing certificate with a private key was imported.' }

          "WINDOWS_SIGNING_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Imported code-signing certificate $($cert.Thumbprint)"

      - name: Build Windows desktop packages
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 'Sign Windows packages (Y-19)'
        if: ${{ env.WINDOWS_SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        env:
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $timestamp = if ($env:WINDOWS_SIGNING_TIMESTAMP_URL) { $env:WINDOWS_SIGNING_TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }

          # Runs after the build, because the artifacts must exist to be signed.
          $targets = Get-ChildItem 'src-tauri\target\release\bundle' -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi' }
          if (-not $targets) { throw 'No .exe or .msi artifacts found to sign.' }

          foreach ($target in $targets) {
            # Timestamped so the signature outlives the certificate's expiry.
            & signtool sign /tr $timestamp /td sha256 /fd sha256 `
              /sha1 $env:WINDOWS_SIGNING_THUMBPRINT $target.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($target.FullName)" }
            Write-Host "Signed $($target.Name)"
          }

      - name: 'Release security hardening gate'
        run: npm run security:release-hardening

      - name: Collect Windows release artifacts
        run: npm run release:collect -- --platform windows --skip-extensions

      - name: Collect Windows updater bundles and signatures
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-local/windows | Out-Null
          Get-ChildItem src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Name -match '\.sig$|\.tar\.gz$|\.nsis\.zip$' } |
            Copy-Item -Destination release-local/windows
          Get-ChildItem release-local/windows | Select-Object -ExpandProperty Name

      - name: 'Signing report gate — block unsigned releases (Y-19)'
        run: npm run desktop:release:signing:report -- --platform windows --dir release-local/windows --require-signed

      - name: Desktop release gate
        run: npm run desktop:release:gate -- --platform windows
      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (SHA-pinned)
        with:
          name: aegis-vault-v7-windows
          if-no-files-found: error
          retention-days: 14
          path: release-local/windows/**

  build-android:
    name: Build signed Android APKs
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1 (SHA-pinned)
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (SHA-pinned)
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (SHA-pinned)
        with:
          workspaces: src-tauri -> target

      - name: Setup JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5.7.0 (SHA-pinned)
        with:
          distribution: temurin
          java-version: 17

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Resolve Android NDK path
        run: |
          NDK_DIR=$(ls -d "${ANDROID_HOME}/ndk/"* 2>/dev/null | head -n 1 || true)
          if [ -z "$NDK_DIR" ]; then
            echo "::error::Android NDK not found on runner (ANDROID_HOME=${ANDROID_HOME})"
            exit 1
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK resolved: $NDK_DIR"

      - name: Verify and decode Android signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.AEGIS_ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.AEGIS_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.AEGIS_ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for v in KEYSTORE_B64 KEY_ALIAS KEYSTORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing Android signing secret: $v (add ANDROID_KEYSTORE_BASE64, AEGIS_ANDROID_KEY_ALIAS, AEGIS_ANDROID_KEYSTORE_PASSWORD, AEGIS_ANDROID_KEY_PASSWORD as repository secrets)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "${RUNNER_TEMP}/aegis-release.keystore"
          echo "Keystore decoded to ${RUNNER_TEMP}/aegis-release.keystore"

      - name: Build Android release APKs (all ABIs)
        env:
          AEGIS_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/aegis-release.keystore
          AEGIS_ANDROID_KEY_ALIAS: ${{ secrets.AEGIS_ANDROID_KEY_ALIAS }}
          AEGIS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.AEGIS_ANDROID_KEYSTORE_PASSWORD }}
          AEGIS_ANDROID_KEY_PASSWORD: ${{ secrets.AEGIS_ANDROID_KEY_PASSWORD }}
        run: npx tauri android build --apk

      - name: Collect Android release artifacts
        run: |
          mkdir -p release-local/android
          find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' \
            -exec cp {} release-local/android/ \;
          count=$(find release-local/android -name '*.apk' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No release APKs were produced"
            exit 1
          fi
          echo "Collected ${count} APK(s):"
          ls -la release-local/android/

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (SHA-pinned)
        with:
          name: aegis-vault-v7-android
          if-no-files-found: error
          retention-days: 14
          path: release-local/android/**

  build-extensions:
    name: Build browser extension packages
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1 (SHA-pinned)
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build extension bundles (Chrome / Firefox / Safari)
        run: npm run build:extension

      - name: Package Chrome and Edge zips
        run: npm run package:chrome:zip -- --skip-build

      - name: Package Firefox xpi
        run: npm run package:firefox:xpi -- --skip-build

      - name: Sign Firefox xpi with Mozilla AMO (optional)
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
          AMO_CHANNEL: unlisted
        run: |
          if [ -n "$WEB_EXT_API_KEY" ] && [ -n "$WEB_EXT_API_SECRET" ]; then
            npm run sign:firefox:xpi -- --skip-build
          else
            echo "AMO credentials (WEB_EXT_API_KEY / WEB_EXT_API_SECRET) not configured — publishing unsigned xpi only."
          fi

      - name: Package Safari WebExtension bundle
        run: |
          npm run extension:safari
          mkdir -p release-local/safari
          VERSION=$(node -p "require('./package.json').version")
          zip -qr "release-local/safari/aegis-vault-7-safari-v${VERSION}-webextension.zip" dist-extension-safari
          echo "Safari WebExtension bundle zipped (native Safari app wrapper still requires Xcode conversion on macOS)."

      - name: Upload extension artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (SHA-pinned)
        with:
          name: aegis-vault-v7-extensions
          if-no-files-found: error
          retention-days: 14
          path: |
            release-local/chrome/**
            release-local/edge/**
            release-local/firefox/**
            release-local/safari/**

  generate-sbom:
    name: Generate SBOM (CycloneDX)
    needs: [plan, build-linux, build-macos, build-windows, build-android, build-extensions]
    # `always()` is required, not optional: a job whose `needs` includes a
    # *skipped* job is itself skipped in GitHub Actions, so without this a
    # partial release would silently produce no SBOM and no release at all.
    # The explicit result checks are what keep it safe -- every platform that
    # was selected must have actually succeeded.
    if: >-
      always() && !cancelled() &&
      needs.build-linux.result == 'success' &&
      needs.build-android.result == 'success' &&
      needs.build-extensions.result == 'success' &&
      (needs.plan.outputs.macos != 'true' || needs.build-macos.result == 'success') &&
      (needs.plan.outputs.windows != 'true' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (SHA-pinned)
        with:
          node-version: 22

      - name: Install dependencies (full, incl. dev — required by @cyclonedx/cyclonedx-npm)
        run: npm ci

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.9.4 (SHA-pinned)
        with:
          tool: cargo-cyclonedx

      - name: Generate npm SBOM (CycloneDX 1.6, JSON)
        run: node scripts/generate-npm-sbom.cjs

      - name: Generate Rust/Tauri SBOM (CycloneDX 1.5, JSON, all targets)
        working-directory: src-tauri
        run: cargo cyclonedx --all-features --format json --spec-version 1.5 --target all --override-filename cargo-sbom

      - name: Stage SBOMs
        run: |
          mkdir -p release-local/sbom
          mv src-tauri/cargo-sbom.json release-local/sbom/cargo-sbom.json
          ls -la release-local/sbom/

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (SHA-pinned)
        with:
          name: aegis-vault-v7-sbom
          if-no-files-found: error
          retention-days: 14
          path: release-local/sbom/*.json

  publish:
    name: Sign and publish GitHub Release
    needs: [plan, build-linux, build-macos, build-windows, build-android, build-extensions, generate-sbom]
    # Same reasoning as generate-sbom: `always()` so a skipped optional platform
    # does not skip the release, plus explicit success checks so a *failed*
    # platform still blocks it. The difference between "skipped" and "failed" is
    # the whole mechanism, and it is decided here rather than by accident.
    if: >-
      always() && !cancelled() &&
      needs.generate-sbom.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-android.result == 'success' &&
      needs.build-extensions.result == 'success' &&
      (needs.plan.outputs.macos != 'true' || needs.build-macos.result == 'success') &&
      (needs.plan.outputs.windows != 'true' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned)

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          # package.json carries a 4-part version (Android versionCode scheme).
          # Compare against the tag with trailing zero segments trimmed on BOTH
          # sides: v7.0.4 matches 7.0.4.0, and v7.0.4.1 matches 7.0.4.1.
          PKG_NORM=$(node -p "require('./package.json').version.replace(/(\.0)+$/,'')")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_NORM=$(printf '%s' "$TAG_VERSION" | sed -E 's/(\.0)+$//')
          if [ "$PKG_NORM" != "$TAG_NORM" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Releasing version ${PKG_VERSION} (tag ${GITHUB_REF_NAME})"

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0 (SHA-pinned)
        with:
          name: aegis-vault-v7-linux
          path: release-local/linux

      - name: Download macOS artifacts
        # Skipped when macOS was not selected: download-artifact fails outright
        # on a missing artifact, so an unconditional step would turn a partial
        # release back into a hard failure.
        if: needs.plan.outputs.macos == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0 (SHA-pinned)
        with:
          name: aegis-vault-v7-macos
          path: release-local/macos

      - name: Download Windows artifacts
        if: needs.plan.outputs.windows == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0 (SHA-pinned)
        with:
          name: aegis-vault-v7-windows
          path: release-local/windows

      - name: Download Android artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0 (SHA-pinned)
        with:
          name: aegis-vault-v7-android
          path: release-local/android

      - name: Download extension artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0 (SHA-pinned)
        with:
          name: aegis-vault-v7-extensions
          path: release-local/extensions

      - name: Download SBOM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.0 (SHA-pinned)
        with:
          name: aegis-vault-v7-sbom
          path: release-local/sbom

      - name: Generate Tauri updater manifest (latest.json)
        run: node scripts/generate-updater-manifest.cjs

      # The safety net for partial releases, and deliberately independent of the
      # `plan` job. Each build job already gated its own artifacts, but this
      # re-runs the same gate against what was actually *downloaded* here, at
      # the last moment before anything is uploaded.
      #
      # That separation is the point: platform selection decides what is
      # INCLUDED, and this step decides whether anything UNSIGNED can SHIP.
      # A bug in `plan`, a mis-set repository variable, or a hand-edited `if:`
      # cannot turn into an unsigned public artifact, because the presence of
      # macOS/Windows files is what triggers the check -- not the flag that was
      # supposed to allow them.
      #
      # Runs before the prune step, which deletes the per-platform metadata.json
      # this gate reads.
      - name: Re-verify collected artifacts before publishing
        run: |
          set -euo pipefail
          for platform in macos windows; do
            dir="release-local/$platform"
            if [ -d "$dir" ] && [ -n "$(ls -A "$dir" 2>/dev/null)" ]; then
              echo "::group::Re-verifying $platform artifacts"
              npm run desktop:release:signing:report -- \
                --platform "$platform" --dir "$dir" --require-signed
              echo "::endgroup::"
            else
              echo "No $platform artifacts present - nothing to verify."
            fi
          done

      - name: Fail if a selected platform produced no artifacts
        run: |
          set -euo pipefail
          for platform in linux macos windows; do
            dir="release-local/$platform"
            if [ ! -d "$dir" ] || [ -z "$(ls -A "$dir" 2>/dev/null)" ]; then
              if [ "$platform" = "linux" ]; then
                echo "::error::Linux artifacts are missing; a release with no Linux build is not a release"
                exit 1
              fi
              echo "::notice::$platform was not published in this release."
            fi
          done

      - name: Prune non-distributable files and deduplicate basenames
        run: |
          cd release-local
          # 1) Remove internal/evidence/build-intermediate files that must not be
          #    published as release assets (per-platform copies also collide on
          #    identical basenames and break action-gh-release asset uploads).
          #    SHA256SUMS.txt: the per-platform checksum manifests (e.g. the Android
          #    evidence copy) are superseded by the single global manifest generated
          #    in the next step — keeping them causes a basename collision with
          #    release-local/SHA256SUMS.txt ("update-a-release-asset: Not Found").
          prune_names='README.md DESKTOP_MANUAL_SMOKE_CHECKLIST.md metadata.json Info.plist CodeResources icon.icns aegis-vault-v7 control.tar.gz data.tar.gz manifest.json SHA256SUMS.txt'
          for name in $prune_names; do
            find linux macos windows android extensions sbom updater -type f \( \
              -name "$name" -o -name "$name.sig" -o -name "$name.pem" \) -delete 2>/dev/null || true
          done
          # 2) Deduplicate basenames across staging dirs: keep first (sorted), drop
          #    later copies together with their signatures.
          dupes=$(find linux macos windows android extensions sbom updater -type f ! -name '*.sig' ! -name '*.pem' -printf '%f\n' | sort | uniq -d)
          for dup in $dupes; do
            first=1
            while IFS= read -r f; do
              if [ "$first" = "1" ]; then first=0; continue; fi
              echo "dedupe: removing duplicate '$dup' at $f"
              rm -f "$f" "$f.sig" "$f.pem"
            done < <(find linux macos windows android extensions sbom updater -type f -name "$dup" | sort)
          done
          # 3) Fail hard if duplicate basenames remain (upload would break anyway).
          if find linux macos windows android extensions sbom updater -type f ! -name '*.sig' ! -name '*.pem' -printf '%f\n' | sort | uniq -d | grep -q .; then
            echo "::error::Duplicate basenames remain in release staging"
            exit 1
          fi
          echo "Prune + dedupe complete."
          find linux macos windows android extensions sbom updater -type f | wc -l

      - name: Generate global SHA256SUMS.txt
        run: |
          cd release-local
          find linux macos windows android extensions sbom updater -type f ! -name 'metadata.json' ! -name 'README.md' \
            -exec sha256sum {} \; \
            | awk '{ n=split($2, p, "/"); printf "%s  %s\n", $1, p[n] }' \
            | sort > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.10.1 (SHA-pinned)

      - name: Sign all artifacts (Sigstore keyless)
        run: |
          set -e
          signed=0
          while IFS= read -r -d '' f; do
            # Preserve existing Tauri (minisign) signatures — they are consumed by the updater.
            if [ -f "${f}.sig" ]; then
              echo "skip (already signed by Tauri): ${f}"
              continue
            fi
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
            signed=$((signed + 1))
          done < <(find release-local/linux release-local/macos release-local/windows release-local/android release-local/extensions release-local/sbom release-local/updater release-local/SHA256SUMS.txt -type f ! -name '*.sig' ! -name '*.pem' -print0)
          echo "Signed ${signed} artifact(s) with Sigstore keyless."
          [ "$signed" -gt 0 ] || { echo "::error::No artifacts were signed"; exit 1; }

      - name: Remove pre-existing release for tag (idempotent publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A previously failed publish may have left a release (with assets) for this
          # tag — including a DRAFT. Drafts are invisible to /releases/tags (that
          # endpoint only returns published releases), which is exactly how a stale
          # draft survived and raced with action-gh-release's asset delete/re-upload
          # ("already_exists" / "delete-a-release-asset: Not Found"). List ALL releases
          # (drafts included, repo token) and delete every one whose tag matches ours.
          # gh prints HTTP error bodies to stdout too, so only trust purely numeric ids.
          TAG="${{ github.ref_name }}"
          ids=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" 2>/dev/null || true)
          deleted=0
          for id in $ids; do
            case "$id" in
              ''|*[!0-9]*) echo "Ignoring non-numeric API output: $id"; continue ;;
            esac
            echo "Deleting pre-existing release $id for tag $TAG (drafts included)"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
            deleted=$((deleted+1))
          done
          if [ "$deleted" -gt 0 ]; then
            echo "Deleted $deleted pre-existing release(s)."
          else
            echo "No pre-existing release for tag $TAG — clean."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2.4.2 (SHA-pinned)
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            release-local/linux/**
            release-local/macos/**
            release-local/windows/**
            release-local/android/**
            release-local/extensions/**
            release-local/sbom/**
            release-local/updater/latest.json
            release-local/SHA256SUMS.txt

      - name: Publish updater manifest to backup endpoint (update.aegisvault.xyz)
        continue-on-error: true
        env:
          UPDATE_HOST: ${{ secrets.UPDATE_ENDPOINT_HOST }}        # e.g. forgejo-update@vps.example.com (sftp-only chroot user)
          UPDATE_SSH_KEY: ${{ secrets.UPDATE_ENDPOINT_SSH_KEY }}  # private key paired with the VPS deploy user
          UPDATE_KNOWN_HOSTS: ${{ secrets.UPDATE_ENDPOINT_KNOWN_HOSTS }} # output of: ssh-keyscan -H update.aegisvault.xyz
        run: |
          set -e
          CLEAN_HOST=$(echo "${UPDATE_HOST:-}" | tr -d '\r\n "' | sed -e 's|^https://||' -e 's|^http://||' -e 's|^sftp://||' -e 's|/$||')
          if [ -z "$CLEAN_HOST" ] || [ -z "${UPDATE_SSH_KEY:-}" ]; then
            echo "::notice::UPDATE_ENDPOINT_HOST / UPDATE_ENDPOINT_SSH_KEY not set or empty — skipping backup endpoint publish."
            exit 0
          fi
          mkdir -p ~/.ssh
          if [ -n "${UPDATE_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$UPDATE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::UPDATE_ENDPOINT_KNOWN_HOSTS not set — falling back to accept-new (TOFU)."
            ssh-keyscan -H update.aegisvault.xyz >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
          printf '%s\n' "$UPDATE_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Remote path is chroot-relative: the deploy user only sees /pub inside
          # /opt/forgejo/update-files. Modern scp uses the SFTP protocol, which is
          # the only channel this user has (ForceCommand internal-sftp, no shell).
          if scp -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            release-local/updater/latest.json \
            release-local/updater/latest.json.sig \
            release-local/SHA256SUMS.txt \
            release-local/SHA256SUMS.txt.sig \
            "$CLEAN_HOST:pub/"; then
            echo "Updater manifest published to backup endpoint."
          else
            echo "::warning::Publishing to backup mirror failed or host unreachable. GitHub Releases is the primary updater source."
          fi


