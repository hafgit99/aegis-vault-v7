name: Manual Desktop Release

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run typecheck and unit tests before packaging
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      build_linux:
        description: Build Linux packages
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      build_macos:
        description: Build macOS packages
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: manual-desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux Release
    if: ${{ github.event.inputs.build_linux == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.3 (SHA-pinned)

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v5.0.0 (SHA-pinned)
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (SHA-pinned)

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (SHA-pinned)
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        if: ${{ github.event.inputs.run_tests == 'true' }}
        run: npm run typecheck

      - name: Unit tests
        if: ${{ github.event.inputs.run_tests == 'true' }}
        run: npm run test:unit

      - name: Build browser extensions
        run: npm run build:extension

      - name: Build Linux desktop packages
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect Linux release artifacts
        run: npm run release:collect -- --platform linux

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (SHA-pinned)
        with:
          name: aegis-vault-v7-linux
          if-no-files-found: error
          retention-days: 14
          path: release-local/linux/**

  macos:
    name: macOS Release
    if: ${{ github.event.inputs.build_macos == 'true' }}
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.3 (SHA-pinned)

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v5.0.0 (SHA-pinned)
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (SHA-pinned)
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (SHA-pinned)
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        if: ${{ github.event.inputs.run_tests == 'true' }}
        run: npm run typecheck

      - name: Unit tests
        if: ${{ github.event.inputs.run_tests == 'true' }}
        run: npm run test:unit

      - name: Build browser extensions
        run: npm run build:extension

      - name: Build macOS universal desktop packages
        run: npx tauri build --target universal-apple-darwin
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect macOS release artifacts
        run: npm run release:collect -- --platform macos

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5.0.0 (SHA-pinned)
        with:
          name: aegis-vault-v7-macos
          if-no-files-found: error
          retention-days: 14
          path: release-local/macos/**
