name: Windows Desktop CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-desktop.yml"
      - "docs/**"
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.*"
      - "tsconfig*.json"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/windows-desktop.yml"
      - "docs/**"
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.*"
      - "tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and Build Windows Desktop
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Web build
        run: npm run build

      - name: Windows desktop build
        run: npm run desktop:build

      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: aegis-vault-v7-windows-installers
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: aegis-vault-v7-windows-portable
          if-no-files-found: error
          retention-days: 14
          path: src-tauri/target/release/aegis-vault-v7.exe
