name: Desktop Build CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "src-extension/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.*"
      - "tsconfig*.json"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "src-extension/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.*"
      - "tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    name: Build Tauri (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
        include:
          - platform: windows-latest
            artifact-name: aegis-vault-v7-windows
            artifact-path: |
              src-tauri/target/**/release/bundle/msi/*.msi
              src-tauri/target/**/release/bundle/nsis/*.exe
              src-tauri/target/**/release/*.exe
              src-tauri/target/SHA256SUMS.txt
          - platform: macos-latest
            artifact-name: aegis-vault-v7-macos
            args: '--target universal-apple-darwin'
            artifact-path: |
              src-tauri/target/**/release/bundle/dmg/*.dmg
              src-tauri/target/**/release/bundle/macos/*.app
              src-tauri/target/SHA256SUMS.txt
          - platform: ubuntu-22.04
            artifact-name: aegis-vault-v7-linux
            artifact-path: |
              src-tauri/target/**/release/bundle/deb/*.deb
              src-tauri/target/**/release/bundle/appimage/*.AppImage
              src-tauri/target/SHA256SUMS.txt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build Tauri app (without release)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Build Tauri app (with release)
        if: "startsWith(github.ref, 'refs/tags/v')"
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: aegis-vault-v${{ github.ref_name }}
          args: ${{ matrix.args }}

      - name: Generate SHA-256 Checksums
        run: node scripts/generate-checksums.cjs

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ matrix.artifact-path }}
