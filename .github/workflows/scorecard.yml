# OpenSSF Scorecard — supply-chain security self-assessment
# Results are published to the OSSF Scorecard API and uploaded to code scanning.
# https://github.com/ossf/scorecard-action
on:
  branch_protection_rule:
  schedule:
    # Tuesdays 05:40 UTC — weekly assessment
    - cron: "40 5 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

# Declare read-only access upfront; jobs elevate their own scopes.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload SARIF results to code scanning.
      security-events: write
      # Needed to publish results to the scorecard REST API (OIDC token).
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
